substitutions:
  _REGION: asia-northeast3
  _REPOSITORY: openshelf
  _SERVICE: openshelf-pay-orchestrator
  _BACKEND_URL: https://REPLACE_WITH_BACKEND_RUN_URL
  _PAY_SH_URL: https://REPLACE_WITH_PAY_SH_RUN_URL
  _KMS_KEY_NAME: projects/PROJECT/locations/LOCATION/keyRings/RING/cryptoKeys/KEY/cryptoKeyVersions/1
  _KMS_PUBKEY: REPLACE_WITH_KMS_SOLANA_PUBKEY
  _SERVICE_ACCOUNT: openshelf-pay@PROJECT_ID.iam.gserviceaccount.com

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - agent-orchestrator/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/orchestrator:$BUILD_ID
      - agent-orchestrator
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/orchestrator:$BUILD_ID
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/orchestrator:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_SERVICE_ACCOUNT}
      - --allow-unauthenticated
      - --min-instances=1
      - --max-instances=1
      - --no-cpu-throttling
      - --concurrency=20
      - --set-env-vars=RUST_API_URL=${_BACKEND_URL},PAY_SH_GATEWAY_BASE=${_PAY_SH_URL},OPENSHELF_PAY_GCP_KMS_KEY_NAME=${_KMS_KEY_NAME},OPENSHELF_PAY_GCP_KMS_PUBKEY=${_KMS_PUBKEY}
      - --set-secrets=OPENSHELF_INTERNAL_TOKEN=openshelf-internal-token:latest,OPENSHELF_PAY_RPC_URL=openshelf-pay-rpc-url:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/orchestrator:$BUILD_ID
