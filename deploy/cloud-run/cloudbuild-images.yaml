substitutions:
  _REGION: asia-northeast3
  _REPOSITORY: obolus
  _TAG: manual
  _RELEASE_SHA: manual

# A cold Pay.sh/Solana dependency build exceeded 40 minutes in the first
# production CD run. Keep this below the enclosing 85-minute release job.
timeout: 3600s

# A caller must still pass --service-account explicitly. Keeping logs in
# Cloud Logging is required when Cloud Build runs as a user-specified account.
options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: api
    name: gcr.io/cloud-builders/docker@sha256:617f98016081e2978c0b44184d7b09446027b909f1078b8fdc23efc4c74c5f20
    waitFor: ['-']
    args:
      - build
      - --label
      - org.opencontainers.image.revision=${_RELEASE_SHA}
      - --file
      - backend/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:${_TAG}
      - backend

  - id: browser-gateway
    name: gcr.io/cloud-builders/docker@sha256:617f98016081e2978c0b44184d7b09446027b909f1078b8fdc23efc4c74c5f20
    waitFor: ['-']
    args:
      - build
      - --label
      - org.opencontainers.image.revision=${_RELEASE_SHA}
      - --file
      - payment-gateway/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/gateway:${_TAG}
      - payment-gateway

  - id: orchestrator
    name: gcr.io/cloud-builders/docker@sha256:617f98016081e2978c0b44184d7b09446027b909f1078b8fdc23efc4c74c5f20
    waitFor: ['-']
    args:
      - build
      - --label
      - org.opencontainers.image.revision=${_RELEASE_SHA}
      - --file
      - agent-orchestrator/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/orchestrator:${_TAG}
      - agent-orchestrator

  - id: pay-sh
    name: gcr.io/cloud-builders/docker@sha256:617f98016081e2978c0b44184d7b09446027b909f1078b8fdc23efc4c74c5f20
    waitFor: ['-']
    args:
      - build
      - --label
      - org.opencontainers.image.revision=${_RELEASE_SHA}
      - --file
      - pay/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/pay:${_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/gateway:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/orchestrator:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/pay:${_TAG}
