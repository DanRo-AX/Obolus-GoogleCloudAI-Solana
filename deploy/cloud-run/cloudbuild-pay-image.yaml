substitutions:
  _REGION: asia-northeast3
  _REPOSITORY: obolus
  _TAG: manual

timeout: 1800s

options:
  machineType: E2_HIGHCPU_8

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - pay/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/pay:${_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/pay:${_TAG}
