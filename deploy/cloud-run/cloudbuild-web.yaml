substitutions:
  _REGION: asia-northeast3
  _REPOSITORY: obolus
  _TAG: manual

timeout: 1200s

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - deploy/cloud-run/web.Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:${_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:${_TAG}
