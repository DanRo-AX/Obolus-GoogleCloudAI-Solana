# Official Pay.sh sandbox gateway for the agent-facing OPENSHELF API.
#
# The free resolve/prepare calls expose only payment-safe metadata. Each paid
# path opens exactly one quoted human document. Pay.sh resolves OWNER_WALLET
# from the `owner_wallet` query parameter and transfers all but one atomic USDC
# unit directly to that verified contributor wallet. Rust re-validates the
# path price, query capability, and owner wallet after payment and before text
# is released.
name: openshelf
subdomain: openshelf
title: "OPENSHELF Human Data API"
description: "Search first-person human memory, then pay only for the individual documents an agent opens."
category: data
version: v2
routing:
  type: proxy
  url: "${OPENSHELF_BACKEND_URL}/"
  auth:
    method: header
    key: x-openshelf-internal-token
    value_from_env: OPENSHELF_INTERNAL_TOKEN
operator:
  currencies:
    usd: ["USDC"]
  network: localnet
  fee_payer: true

recipients:
  owner:
    account: "${OWNER_WALLET}"
    label: "Verified human DB owner"

endpoints:
  - method: GET
    path: "healthz"
    description: "Check whether the OPENSHELF human-data backend is healthy."

  - method: POST
    path: "api/v1/questions/resolve"
    description: "Search payment-safe human-document metadata without opening private passages."

  - method: GET
    path: "api/v1/questions/{query_id}/pay-sh-resources/{handle}"
    description: "Prepare one query-bound Pay.sh URL and its verified contributor recipient."

  - method: GET
    path: "api/v1/questions/{query_id}/pay-sh-documents/{handle}"
    description: "Recover a Pay.sh document already opened for the same query without charging again."

  - method: GET
    path: "api/v2/pay-sh/documents/5/{query_id}/{handle}"
    resource: "human-document-krw-5"
    description: "Open one quoted five-won human document after an exact MPP charge."
    metering:
      schemes: ["mpp-charge"]
      dimensions:
        - direction: usage
          unit: requests
          scale: 1
          tiers:
            - price_usd: 0.003704
      splits:
        - recipient: owner
          amount: 0.003703
          memo: "OPENSHELF human document owner"

  - method: GET
    path: "api/v2/pay-sh/documents/10/{query_id}/{handle}"
    resource: "human-document-krw-10"
    description: "Open one quoted ten-won human document after an exact MPP charge."
