# Static local sandbox compatibility only. Production settlement uses the
# dynamic per-document gateway in payment-gateway/src/main.ts.
name: openshelf
subdomain: openshelf
title: "OPENSHELF"
description: "Search paid, first-person documents and open only purchased passages."
category: data
version: v1
routing:
  type: proxy
  url: http://127.0.0.1:8787/
operator:
  currencies:
    usd: ["USDC"]
  network: localnet
  fee_payer: true

endpoints:
  - method: GET
    path: "healthz"
    description: "Backend health check"

  - method: POST
    path: "api/v1/questions/resolve"
    description: "Search document metadata and return a payment-safe quote or open-call draft"

  - method: GET
    path: "api/flash-research"
    description: "Open the passages previously quoted for a query"
    metering:
      dimensions:
        - direction: usage
          unit: requests
          scale: 1
          tiers:
            - price_usd: 0.001
